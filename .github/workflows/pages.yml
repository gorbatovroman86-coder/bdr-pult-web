# Публикация на GitHub Pages.
# Проверки -> сборка -> публикация. Если эталоны разошлись, сайт не обновится.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc -b --noEmit

      - name: Линт
        run: npm run lint

      # Если эталоны разошлись — сайт не обновляется.
      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/
          # Адрес хранилища в репозитории не хранится — только имя секрета.
          # Секрет не задан → сборка выходит с пустым адресом, и пульт
          # работает локально, пока адрес не введут в самом пульте.
          PUBLIC_API_BASE: ${{ secrets.PUBLIC_API_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
